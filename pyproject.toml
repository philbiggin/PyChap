[build-system]
# >=64 specifically (not just >=61) because editable installs
# (`pip install -e .`) need setuptools' PEP 660 `build_editable` hook,
# added in 64.0. With an older setuptools already on PATH and pip unable
# to fetch a newer one in an isolated build (e.g. no network), pip fails
# with "uses a build backend that is missing the 'build_editable' hook".
# `pip install -e .` has turned out to be fragile across environments in
# practice (old pip/setuptools mismatches, conda interpreters missing
# their own pip module, ...); see README.md's Installation section --
# in short, you don't actually need it, PyChap works fine via PYTHONPATH
# with no installation step at all.
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyChap"
version = "0.1.0"
description = "A Python 3 reimplementation of the core pore/pathway analysis of CHAP (Channel Annotation Package), built on MDAnalysis so it reads GROMACS .xtc/.tpr/.gro trajectories directly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PyChap contributors" }]
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.6",
    "MDAnalysis>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
pychap = "pychap.cli:main"

[tool.setuptools.packages.find]
include = ["pychap*"]
