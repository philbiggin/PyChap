[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyChap"
version = "0.1.0"
description = "A Python 3 reimplementation of the core pore/pathway analysis of CHAP (Channel Annotation Package), built on MDAnalysis so it reads GROMACS .xtc/.tpr/.gro trajectories directly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PyChap contributors" }]
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.6",
    "MDAnalysis>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
pychap = "pychap.cli:main"

[tool.setuptools.packages.find]
include = ["pychap*"]
